[workspace]
resolver = "2"
members = [
    "backend",
    "frontend/rust",
]

[patch.crates-io]
primp = { path = "backend/vendor/primp" }
netstack-smoltcp = { path = "backend/vendor/netstack-smoltcp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
debug = false
incremental = false
overflow-checks = false
